[project]
name = "limite-runner"
version = "0.1.4"
description = "Local runner for Limite 1B Violetto: interchangeable backends (llamacpp / litert / transformers), CLI and OpenAI-compatible server"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "limite-runner contributors" }]
keywords = ["limite", "llm", "inference", "openai-compatible", "math-reasoning"]
dependencies = [
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "httpx>=0.27",
    "psutil>=5.9",
    "platformdirs>=4.0",
    "tqdm>=4.66",
    "safetensors>=0.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
llamacpp = []
litert = ["litert-lm-api==0.17.0"]
transformers = [
    "torch>=2.11",
    "transformers>=5.6.2",
    "tokenizers>=0.21",
]
all = [
    "limite-runner[litert,transformers]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "openai>=1.40",
]

[project.scripts]
limite = "limite_runner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/limite_runner"]

# Build-time resources ship inside the wheel (limite_runner/data/) so that
# `limite setup --backend llamacpp` works from an install outside the source
# tree without downloading or regenerating anything.
[tool.hatch.build.targets.wheel.force-include]
"scripts/build_llamacpp.sh" = "limite_runner/data/build_llamacpp.sh"
"tools/limite-logits.cpp" = "limite_runner/data/limite-logits.cpp"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
